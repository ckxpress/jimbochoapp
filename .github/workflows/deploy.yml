# Publishes the site to GitHub Pages.
#
# This uses the "GitHub Actions" publishing source rather than pushing the
# gh-pages branch, because a branch push from CI would never publish: "Commits
# pushed by a GitHub Actions workflow that uses the GITHUB_TOKEN do not trigger
# a GitHub Pages build."
#
# Requires Settings → Pages → Build and deployment → Source = "GitHub Actions".
# While that is set, pushing gh-pages does nothing, so `npm run deploy` stops
# being the way the site goes live — a push to main is.
name: Deploy site

on:
  workflow_dispatch:

  # A push that changes what is published, publishes it. Anything touching the
  # site itself or the two scripts that assemble it, and nothing else — a
  # change to an adapter or a letter in docs/ should not redeploy the site.
  #
  # Rebuilding the database stays manual, in the Rebuild catalogue workflow,
  # because that uploads 473 MiB to R2 and overwrites what readers are being
  # served. That one should be asked for, not triggered.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/publish-dir.sh'
      - 'tools/publish-manifest.js'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # to delete a stale artifact before re-uploading

# Never two deployments at once, and never cancel one halfway: a half-published
# site serves a manifest whose database object may not match.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Everything tracked under site/ except the full JSON shards, which a
      # working site never fetches and which took the published site to 462 MB
      # — past what a deployment can publish inside its 10-minute limit.
      - name: Assemble the publishable site
        run: sh tools/publish-dir.sh _site

      - uses: actions/configure-pages@v6

      # Re-running a workflow keeps the previous attempt's artifact, and
      # upload-pages-artifact then adds a second with the same name, so
      # deploy-pages refuses: "Multiple artifacts named github-pages were
      # unexpectedly found for this workflow run. Artifact count is 2."
      #
      # The action has no overwrite input and neither README mentions the
      # error, so the stale one is deleted first. Re-running a failed deploy is
      # the obvious thing to do and should not be a trap — it cost a run here
      # on 7 Nov 2026.
      - name: Drop the artifact left by a previous attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                  --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            echo "deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
