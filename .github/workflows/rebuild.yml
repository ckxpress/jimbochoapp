# The whole catalogue pipeline, so a rebuild needs no computer of your own —
# only a browser, which is the point: run it from the Actions tab.
#
#   import → covers → build:db → commit → upload to R2 → publish
#
# Why it runs here rather than on a laptop: the 729 MB upload and the ~538,000
# cover probes both leave from a datacentre instead of crossing a home VPN, and
# nothing has to stay awake.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions),
# from R2 → Manage R2 API Tokens with Object Read & Write on the one bucket:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET
#
# The deploy is inline rather than a call to deploy.yml on purpose. A reusable
# workflow runs against the caller's commit, which here is the commit *before*
# this job wrote the new shards and manifest — it would publish a manifest
# pointing at the previous database.
name: Rebuild catalogue

on:
  workflow_dispatch:
    inputs:
      cover_limit:
        description: 'Cover lookups this run (0 skips the step)'
        default: '40000'
        required: false
      refresh:
        description: 'Ignore the download cache and re-fetch every source'
        type: boolean
        default: false
      publish:
        description: 'Upload to R2 and publish the site'
        type: boolean
        default: true
      sync_d1:
        description: 'Also apply the search-index delta to D1 (otherwise the plan is only printed)'
        type: boolean
        default: false
      datasets:
        description: 'Import only these dataset ids (space separated); blank imports every source'
        default: ''
        required: false

  schedule:
    # Two cadences, because the sources move at two speeds.
    #
    # Weekly, 3ook only. It is a working bookshop rather than a registry: new
    # titles appear continuously, and about five hundred of them exist in no
    # national bibliography, so until this runs they are in no catalogue at
    # all. Importing one dataset skips re-fetching fifteen others and the
    # cover probes, but it still rebuilds the database, uploads it and syncs
    # D1 — adding records means a new database object however few they are.
    - cron: '0 18 * * 0'
    # Monthly, everything. The Taiwan ISBN feed is monthly and the Hong Kong
    # catalogue lands in quarters, so this is the cadence those sources ask
    # for. On the rare Sunday the 5th both fire; the concurrency group below
    # serialises them and the second finds almost nothing to do.
    - cron: '0 18 5 * *'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # to delete a stale artifact before re-uploading

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # A scheduled run carries no `inputs`, so every `inputs.publish` below
    # would be false and the job would build a database and publish nothing.
    # These resolve what the run is doing once, from whichever event started
    # it, and the steps read them instead.
    env:
      # Only facts here, never derived values. `cond && '0' || fallback` is a
      # trap in these expressions: if '0' is treated as falsy the whole thing
      # evaluates to the fallback, and the weekly run would quietly do 40,000
      # cover probes. Anything with a '0' in it is worked out in shell below.
      WEEKLY: ${{ github.event.schedule == '0 18 * * 0' }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
      IN_DATASETS: ${{ inputs.datasets }}
      IN_COVER_LIMIT: ${{ inputs.cover_limit }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      SYNC_D1: ${{ github.event_name == 'schedule' || inputs.sync_d1 }}
      REFRESH: ${{ inputs.refresh == true }}
    outputs:
      publish: ${{ steps.flags.outputs.publish }}
    # The job ceiling is six hours. A full --recheck of all 538,066 ISBNs runs
    # about eleven at the polite concurrency the cover resolver uses, which is
    # why cover_limit exists: it caps one run, and the cache is committed, so
    # the next run picks up where this one stopped.
    timeout-minutes: 330

    steps:
      # What this run is, in one place and in the log, so a scheduled run that
      # did something unexpected can be read rather than reconstructed.
      - name: Decide what this run does
        id: flags
        run: |
          if [ "$WEEKLY" = "true" ]; then
            # 3ook publishes its own covers, so there is nothing for the
            # resolver to find on a run that imports only 3ook.
            DATASETS="3ook"
            COVER_LIMIT="0"
          else
            DATASETS="$IN_DATASETS"
            COVER_LIMIT="${IN_COVER_LIMIT:-40000}"
          fi
          {
            echo "DATASETS=$DATASETS"
            echo "COVER_LIMIT=$COVER_LIMIT"
          } >> "$GITHUB_ENV"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "datasets    : ${DATASETS:-(all)}"
          echo "cover limit : $COVER_LIMIT"
          echo "publish     : $PUBLISH"
          echo "sync D1     : $SYNC_D1"
          echo "refresh     : $REFRESH"

      - uses: actions/checkout@v7
        with:
          # deploy.sh is not used here, but a shallow clone cannot be pushed
          # from, and this job commits the rebuilt shards back.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install sqlite3 and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 rclone
          # build-sqlite.js checks for FTS5 itself and fails loudly, but a
          # clear line here beats a failure forty minutes into an import.
          sqlite3 :memory: 'CREATE VIRTUAL TABLE t USING fts5(x); SELECT 1;' >/dev/null
          echo "sqlite3 $(sqlite3 --version | cut -d' ' -f1) with FTS5 · rclone $(rclone version | head -1)"

      # Before the import, not after: this writes cache/3ook-feed.json, which
      # the `3ook` dataset is imported from, and CI starts from a fresh
      # checkout where that file does not exist. It also writes
      # site/data/3ook-links.json, the availability map the book page uses.
      #
      # Not continue-on-error any more. It was, while it only produced a link
      # map that could safely go stale; now the import depends on it, and a
      # missing feed would drop 2,255 records from the catalogue silently.
      - name: Read 3ook.com's catalogue
        run: npm run 3ook

      - name: Import datasets
        run: |
          if [ -n "$DATASETS" ]; then
            echo "Importing only: $DATASETS"
            # shellcheck disable=SC2086
            npm run import -- $DATASETS
          elif [ "$REFRESH" = "true" ]; then
            npm run import -- --refresh
          else
            npm run import
          fi

      - name: Resolve covers
        if: env.COVER_LIMIT != '0'
        run: npm run covers -- --limit "$COVER_LIMIT"

      - name: Build the database
        run: npm run build:db -- --db-url https://db.jimbocho.app/

      # Before the commit, not after. A failed upload must leave nothing behind:
      # the first CI rebuild committed its manifest and then failed here, so
      # main advertised an object that returned 404 and was one deploy away from
      # going live. The site survived only because the publish steps are gated
      # on this one.
      - name: Upload the database to R2
        if: env.PUBLISH == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run upload:db

      # Search is answered from D1, which this pipeline otherwise never touches
      # — the split that made docs/open-issues.md issue 7. tools/d1/sync.js
      # writes only what changed: a rebuild that moved nothing plans zero, and
      # a month's drift measured 94,690 writes against a free plan that allows
      # 100,000 a day, where a full re-import is 4,748,153.
      #
      # It has to run here rather than on anyone's laptop. sync.js diffs D1
      # against site/data/books.db, and the only copy of that file which
      # matches what was just uploaded to R2 is the one this job built: a
      # laptop that re-imports gets a slightly different catalogue, and D1
      # would end up agreeing with one nobody is reading.
      #
      # The plan is always printed. Applying it needs the sync_d1 input, so a
      # rebuild shows what it would write to the live database before it
      # writes anything.
      - name: Sync the search index to D1
        if: env.PUBLISH == 'true'
        # Still non-fatal: the site is already uploaded and published by now,
        # and a D1 problem should not mark that run failed. But it reports as
        # a yellow warning rather than a red X, so the summary below has to
        # say plainly when it did not work.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A pipeline's status is its last command's, so `node … | tee` would
          # report tee's 0 however sync.js fared — which, with
          # continue-on-error below, is a step that looks fine and writes an
          # empty plan. Both of those hid the first failures here.
          set -o pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            {
              echo "### Search index"
              echo
              echo "> Skipped: no \`CLOUDFLARE_API_TOKEN\` secret, so D1 was not read."
              echo "> Search keeps answering from the previous import until it is synced."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No CLOUDFLARE_API_TOKEN — skipping." >&2
            exit 0
          fi

          # Planning reads the whole of `books` back out of D1 — 446,090 rows,
          # 9% of a day's read allowance — so it happens exactly once. The
          # earlier version ran --dry and then the real thing, costing 892,180
          # reads per applying run, which is most of how four rebuilds in a day
          # exhausted the allowance and left search returning 500s to readers.
          #
          # Without the flag sync.js prints the same plan and also writes the
          # chunks; --dry only withholds them. So the applying path omits it.
          PLAN_ARGS=""
          if [ "$SYNC_D1" != "true" ]; then PLAN_ARGS="--dry"; fi

          if ! node tools/d1/sync.js jimbocho-search $PLAN_ARGS 2>&1 | tee /tmp/d1-plan.txt; then
            {
              echo "### Search index"
              echo
              echo "> **Planning failed.** Search keeps answering from the previous import."
              echo
              echo '```'
              tail -30 /tmp/d1-plan.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Search index"
            echo
            echo '```'
            sed -n '/^Plan/,$p' /tmp/d1-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SYNC_D1" != "true" ]; then
            {
              echo
              echo "> Not applied. Re-run with **Also apply the search-index delta to D1** ticked."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! sh tools/d1/sync.sh jimbocho-search 2>&1 | tee /tmp/d1-apply.txt; then
            {
              echo
              echo "> **Applying failed.** Search keeps answering from the previous import."
              echo
              echo '```'
              tail -30 /tmp/d1-apply.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo
            echo "> Applied."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the rebuilt catalogue
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing changed — no commit"
          else
            git commit -q -m "Rebuild catalogue: $(node -e "
              const m = require('./site/data/manifest.json');
              process.stdout.write(m.totalBooks.toLocaleString('en-US') + ' books, ' + m.coversFound.toLocaleString('en-US') + ' covers');
            ")"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish only after the database is in R2. The manifest advertises that
      # object's exact byte length, and publish-dir.sh refuses to assemble a
      # site whose database is not being served — the one failure here that
      # otherwise surfaces weeks later as wrong facet counts in the tail.
      - name: Assemble the publishable site
        if: env.PUBLISH == 'true'
        run: sh tools/publish-dir.sh _site

      - uses: actions/configure-pages@v6
        if: env.PUBLISH == 'true'

      # Re-running a workflow keeps the previous attempt's artifact, and
      # upload-pages-artifact then adds a second with the same name, so
      # deploy-pages refuses: "Multiple artifacts named github-pages were
      # unexpectedly found for this workflow run. Artifact count is 2."
      #
      # The action has no overwrite input and neither README mentions the
      # error, so the stale one is deleted first. Re-running a failed deploy is
      # the obvious thing to do and should not be a trap — it cost a run here
      # on 7 Nov 2026.
      - name: Drop the artifact left by a previous attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                  --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            echo "deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v5
        if: env.PUBLISH == 'true'
        with:
          path: _site

      - name: Summary
        if: always()
        run: |
          {
            echo "### Catalogue rebuild"
            echo
            if [ -f site/data/manifest.json ]; then
              node -e "
                const m = require('./site/data/manifest.json');
                console.log('| | |');
                console.log('|---|---|');
                console.log('| books | ' + m.totalBooks.toLocaleString('en-US') + ' |');
                console.log('| covers | ' + m.coversFound.toLocaleString('en-US') + ' |');
                console.log('| database | ' + (m.db.bytes / 1048576).toFixed(1) + ' MB |');
                console.log('| object | \`' + m.db.url.split('/').pop() + '\` |');
                console.log('| committed | ${{ steps.commit.outputs.changed }} |');
              "
            fi
            # Said here because nothing else says it. This job writes R2 and
            # never touches D1, so book pages and browse views move to the new
            # database while search keeps answering from the previous import.
            # No error marks that; see docs/open-issues.md issue 7 for why it
            # is not simply wired up (a full re-import is 4,748,153 writes,
            # 47 days of the free plan's allowance).
            if [ "$PUBLISH" = "true" ]; then
              echo
              echo "> **Search is now on the previous snapshot.** This job does not"
              echo "> update D1. Book pages and browse views read the database above;"
              echo "> \`/api/search\` still answers from whatever was last imported."
              echo "> To resync: \`node tools/build-d1.js\` then"
              echo "> \`sh tools/d1/import.sh jimbocho-search\` from a machine with the"
              echo "> credentials. See docs/open-issues.md issue 7."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A job of its own purely so the `github-pages` environment gates the
  # deployment and nothing else. Declared on the rebuild job, it gated the
  # whole pipeline: the first CI run was refused in one second by a leftover
  # branch protection rule, before fetching a single byte — and a
  # `publish: false` run, which deploys nothing, would have been refused too.
  publish:
    needs: rebuild
    if: needs.rebuild.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Only once the site is actually live. Every rebuild writes a new object,
  # because the name carries the database's content hash — and a CI build and a
  # laptop build of identical data hash differently, since sqlite versions pack
  # pages differently. Roughly 450 MB would accumulate per run.
  prune:
    needs: [rebuild, publish]
    if: needs.rebuild.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The rebuild job pushed the new manifest; this needs that version to
          # know which object is live.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Prune superseded database objects
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: sh tools/prune-r2.sh --confirm
