name = "jimbocho-search"
main = "index.js"
compatibility_date = "2026-10-01"

# A custom domain, so the API is not on workers.dev. It is still a different
# origin from jimbocho.app, so responses carry access-control-allow-origin; a
# plain GET needs no preflight, so that one header is enough.
routes = [
  { pattern = "api.jimbocho.app", custom_domain = true }
]

# Created 8 Nov 2026 with `wrangler d1 create jimbocho-search --location apac`,
# which reported region APAC. The id is an identifier, not a secret.
# `binding` stays DB because the Worker reads env.DB; wrangler's suggested
# name was only a default.
[[d1_databases]]
binding = "DB"
database_name = "jimbocho-search"
database_id = "fdc5039d-aa28-4b84-804b-82d117a171f9"
