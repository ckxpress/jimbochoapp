name = "jimbocho-search"
main = "index.js"
compatibility_date = "2026-10-01"

# workers.dev to begin with, because deploying here needs only
# Workers Scripts : Edit on the account — no zone permissions at all. The
# custom domain below needs Workers Routes : Edit and Zone : Read on the
# jimbocho.app zone, which is worth granting once this is proven rather than
# before. Uncomment it then, and drop workers_dev.
workers_dev = true

# Off because every deployment would otherwise get its own public URL, all of
# them querying the same metered D1. There is no review step here that a
# preview URL would serve — deploys go straight to production — so they are
# only another unlisted path to the row-read allowance.
preview_urls = false

# routes = [
#   { pattern = "api.jimbocho.app", custom_domain = true }
# ]

# Created 8 Nov 2026 with `wrangler d1 create jimbocho-search --location apac`,
# which reported region APAC. The id is an identifier, not a secret.
# `binding` stays DB because the Worker reads env.DB; wrangler's suggested
# name was only a default.
[[d1_databases]]
binding = "DB"
database_name = "jimbocho-search"
database_id = "fdc5039d-aa28-4b84-804b-82d117a171f9"
